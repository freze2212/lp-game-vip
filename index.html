<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CỔNG GAME QUỐC TẾ - ULTIMATE VIP</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="assets/fonts/google_fonts.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <style>
        :root {
            --gold-primary: #ffe600;
            --gold-glow: #ffaa00;
            --neon-pink: #ff0055;
            --neon-cyan: #00f0ff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff88;
            --card-bg: rgba(10, 8, 20, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020105;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Interactive Canvas BG */
        #cyber-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Sound Control Floating Button */
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--neon-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            transform: scale(1.1);
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Ambient Glow Spheres */
        .glow-orb {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(180px);
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
            animation: orbMove 12s ease-in-out infinite alternate;
        }

        .orb-1 { top: -150px; left: -150px; background: var(--neon-purple); }
        .orb-2 { bottom: -150px; right: -150px; background: var(--neon-cyan); animation-delay: -6s; }

        @keyframes orbMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.2); }
        }

        /* 3D Holographic Card Wrapper */
        .card-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 230, 0, 0.3);
            border-radius: 36px;
            padding: 38px 24px 28px;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95),
                        inset 0 0 30px rgba(255, 230, 0, 0.08),
                        0 0 2px rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Cyber Holographic Border Beam */
        .container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, var(--neon-pink), var(--gold-primary), var(--neon-cyan), transparent 30%);
            animation: rotateBeam 6s linear infinite;
            z-index: -2;
        }

        .container::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: var(--card-bg);
            border-radius: 34px;
            z-index: -1;
            backdrop-filter: blur(40px);
        }

        @keyframes rotateBeam {
            100% { transform: rotate(360deg); }
        }

        /* 3D Spinning Crown Logo */
        .logo-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 18px;
        }

        .logo-aura {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 230, 0, 0.4) 0%, transparent 70%);
            animation: pulseAura 2s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .logo-ring-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px dashed var(--gold-primary);
            animation: spinRing 12s linear infinite;
            filter: drop-shadow(0 0 8px var(--gold-glow));
        }

        .logo-ring-inner {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--neon-cyan);
            border-bottom-color: var(--neon-pink);
            animation: spinRing 3s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
        }

        .logo-core {
            position: absolute;
            inset: 10px;
            background: radial-gradient(circle at 30% 30%, #3a2868, #070412);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 230, 0, 0.6);
            box-shadow: inset 0 0 20px rgba(255, 230, 0, 0.4);
        }

        .logo-core i {
            font-size: 40px;
            background: linear-gradient(180deg, #ffffff 0%, #ffe600 60%, #ff7700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(255, 170, 0, 0.7));
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        /* Typography */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 20%, #ffe600 80%, #ff8800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 230, 0, 0.3);
            margin-bottom: 6px;
        }

        .badge-vip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid rgba(255, 0, 85, 0.5);
            color: #ff6699;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 22px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        /* IP Security Terminal */
        .ip-terminal {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .ip-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--neon-cyan);
            font-weight: 700;
        }

        .cyber-spinner {
            width: 13px;
            height: 13px;
            border: 2px solid var(--neon-cyan);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spinRing 0.6s linear infinite;
        }

        .btn-change-ip {
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.2), rgba(157, 0, 255, 0.2));
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.5);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .btn-change-ip:hover {
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.4), rgba(157, 0, 255, 0.4));
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transform: scale(1.03);
        }

        /* Ultimate CTA Button */
        .btn-group {
            display: none;
            flex-direction: column;
            gap: 14px;
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-cta {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 22px;
            text-decoration: none;
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 50%, #ffe600 100%);
            border: 1px solid #ffffff;
            box-shadow: 0 12px 35px rgba(255, 0, 85, 0.55),
                        inset 0 2px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .btn-cta::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 40%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: rotate(30deg);
            animation: lightSweep 3.5s infinite;
        }

        @keyframes lightSweep {
            20% { left: 130%; }
            100% { left: 130%; }
        }

        .btn-cta:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 45px rgba(255, 0, 85, 0.75);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            z-index: 1;
        }

        .btn-cta i.gift-icon {
            font-size: 34px;
            color: #fff;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5));
        }

        .btn-text .title {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .btn-text .sub {
            color: #ffffd0;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-text .badge-req {
            background: #7a0010;
            color: #ffe600;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 6px;
            width: fit-content;
            margin-top: 3px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 230, 0, 0.4);
        }

        .btn-cta i.fa-chevron-right {
            font-size: 16px;
            color: #fff;
            transition: transform 0.3s ease;
            z-index: 1;
        }

        .btn-cta:hover i.fa-chevron-right {
            transform: translateX(6px);
        }

        /* Live Notifications Ticker */
        .ticker-group {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ticker-box {
            font-size: 11.5px;
            padding: 9px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .ticker-bonus {
            color: #ffee77;
            background: rgba(255, 230, 0, 0.06);
            border: 1px solid rgba(255, 230, 0, 0.3);
        }

        .ticker-withdraw {
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-yellow { background: var(--gold-primary); box-shadow: 0 0 10px var(--gold-primary); }
        .dot-green { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

        .ticker-content {
            transition: opacity 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Cyber Stats Dashboard */
        .stats-grid {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 20px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .stat-card:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0; top: 15%;
            height: 70%; width: 1px;
            background: rgba(255, 255, 255, 0.12);
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: var(--neon-cyan);
        }

        .stat-lbl {
            font-size: 10px;
            color: #9494ad;
            margin-top: 2px;
        }
    </style>
    <script src="config.js"></script>
</head>

    <script>
        // ==========================================
        // 1. WEB AUDIO API SOUND EFFECTS (NO EXT FILES)
        // ==========================================
        let soundEnabled = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 600, duration = 0.08, type = 'sine') {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const soundToggleBtn = document.getElementById("soundToggle");
        const soundIcon = document.getElementById("soundIcon");

        soundToggleBtn.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            soundIcon.className = soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
            soundToggleBtn.style.color = soundEnabled ? "var(--neon-green)" : "var(--neon-cyan)";
            if (soundEnabled) playBeep(800, 0.1, 'triangle');
        });

        // Add Hover Sound Effects
        document.querySelectorAll('button, a').forEach(item => {
            item.addEventListener('mouseenter', () => playBeep(520, 0.05, 'sine'));
            item.addEventListener('click', () => playBeep(900, 0.12, 'square'));
        });

        // ==========================================
        // 2. NETWORK CONSTELLATION CANVAS
        // ==========================================
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 50; i++) {
            pts.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                r: Math.random() * 2 + 1
            });
        }

        function drawConstellation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < pts.length; i++) {
                let p = pts[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.fillStyle = "rgba(0, 240, 255, 0.6)";
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < pts.length; j++) {
                    let p2 = pts[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 110) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.2 * (1 - dist / 110)})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawConstellation);
        }
        drawConstellation();

        // ==========================================
        // 3. 3D CARD TILT EFFECT
        // ==========================================
        const cardWrapper = document.getElementById('cardWrapper');

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            cardWrapper.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            cardWrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // ==========================================
        // 4. IP SECURITY SIMULATION LOGIC
        // ==========================================
        function generateIP() {
            const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            return `${rand(50, 190)}.${rand(1, 254)}.${rand(1, 254)}.${rand(1, 254)}`;
        }

        function changeIPProcess() {
            const ipText = document.getElementById("ipText");
            const ipPanel = document.getElementById("ipPanel");
            const btnChangeIp = document.getElementById("btnChangeIp");
            const ipLoader = document.getElementById("ipLoader");
            const btnGroup = document.getElementById("btnGroup");

            ipLoader.style.display = "inline-block";
            ipPanel.style.borderColor = "rgba(0, 240, 255, 0.3)";
            ipPanel.style.background = "rgba(0, 0, 0, 0.5)";
            btnChangeIp.style.display = "none";

            const newIP = generateIP();
            ipText.innerText = `Đang gán IP Mã Hóa: ${newIP}...`;
            playBeep(400, 0.08, 'sine');

            setTimeout(() => {
                ipPanel.style.borderColor = "rgba(0, 255, 136, 0.5)";
                ipPanel.style.background = "rgba(0, 255, 136, 0.08)";
                ipLoader.style.display = "none";
                ipText.innerHTML = `<i class="fa-solid fa-shield-halved" style="color:var(--neon-green);"></i> Đã Kết Nối IP: <b style="color:#fff;">${newIP}</b>`;
                btnChangeIp.style.display = "inline-flex";

                if (btnGroup.style.display !== "flex") {
                    btnGroup.style.display = "flex";
                }
                playBeep(1200, 0.15, 'triangle');
            }, 1100);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(changeIPProcess, 400);
        });

        // ==========================================
        // 5. LIVE TICKER DATA GENERATOR
        // ==========================================
        const prefixes = ["098", "097", "096", "090", "093", "091", "094", "088", "032", "033", "038", "039"];
        const bonusList = ["28.000đ", "88.000đ", "188.000đ", "288.000đ", "588.000đ"];
        const withdrawList = ["1.000.000đ", "2.500.000đ", "5.000.000đ", "8.800.000đ", "15.000.000đ", "32.500.000đ"];

        const getRandom = arr => arr[Math.floor(Math.random() * arr.length)];
        const getPhone = () => `${getRandom(prefixes)}****${Math.floor(10 + Math.random() * 90)}`;

        const bonusEl = document.getElementById("bonusText");
        const withdrawEl = document.getElementById("withdrawText");

        function updateText(el, text) {
            el.style.opacity = '0';
            setTimeout(() => {
                el.innerHTML = text;
                el.style.opacity = '1';
            }, 250);
        }

        function refreshTickers() {
            updateText(bonusEl, `Tài khoản <b>${getPhone()}</b> nhận thưởng KM <b>${getRandom(bonusList)}</b>`);
            updateText(withdrawEl, `Tài khoản <b>${getPhone()}</b> rút thành công <b>${getRandom(withdrawList)}</b>`);
        }

        refreshTickers();
        setInterval(refreshTickers, 2800);

        // ==========================================
        // 6. REALTIME ONLINE COUNTER
        // ==========================================
        const onlineEl = document.getElementById("onlineCount");
        function updateOnline() {
            const count = Math.floor(Math.random() * (6800 - 4500 + 1)) + 4500;
            onlineEl.innerText = count.toLocaleString('vi-VN');
        }
        updateOnline();
        setInterval(updateOnline, 3500);

        // Shortcut Blocking
        document.addEventListener('keydown', (e) => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['U','S'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        });
    </script>

<script id="hub-domains-json-loader">
(function(){
  function apply(u){
    if(!u) return;
    window.REDIRECT_URL=u;
    var links=document.querySelectorAll('a.redirect-link,a.ref-btn,a.btn-register,a.cta-btn');
    for(var i=0;i<links.length;i++){ links[i].setAttribute('href',u); links[i].href=u; }
  }
  fetch('/domains.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(!d) return;
    var h=(window.location.hostname||'').toLowerCase();
    var nh=h.replace(/^www\./,'');
    var e=d[h]||d[nh];
    if(!e) return;
    apply(e.main_url||e.url||e.link||(typeof e==='string'?e:''));
  }).catch(function(){});
})();
</script>
